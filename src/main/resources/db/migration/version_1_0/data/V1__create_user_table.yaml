databaseChangeLog:
  - changeSet:
      id: 1
      author: aleksa-brakor
      changes:
        - createTable:
            tableName: USERS
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: DATE_OF_BIRTH
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: PASSWORD
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    checkConstraint: "LENGTH(PASSWORD) >= 8"
            remarks: "Таблица пользователей. Пароль хранится в виде хеша (рекомендуется использовать BCrypt)."