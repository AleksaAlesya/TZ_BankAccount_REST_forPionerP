databaseChangeLog:
  - changeSet:
      id: 2
      author: aleksa-brakor
      changes:
        - createTable:
            tableName: ACCOUNT
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USER_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_account_user
                    referencedTableName: USERS
                    referencedColumnNames: ID
                    deleteCascade: true
              - column:
                  name: BALANCE
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
                    checkConstraint: "BALANCE >= 0"
              - column:
                  name: INITIAL_BALANCE
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
                    checkConstraint: "BALANCE >= 0"

            remarks: "Таблица счетов пользователей"