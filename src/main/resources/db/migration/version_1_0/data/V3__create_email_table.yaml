databaseChangeLog:
  - changeSet:
      id: 3
      author: aleksa-brakor
      changes:
        - createTable:
            tableName: EMAIL_DATA
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USER_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_email_user
                    referencedTableName: USERS
                    referencedColumnNames: ID
                    deleteCascade: true
              - column:
                  name: EMAIL
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                    unique: true
#                    checkConstraint: "EMAIL ~* '^[A-Za-z0-9._%-]+@[A-Za-z0-9.-]+[.][A-Za-z]+$'"
            remarks: "Таблица email-адресов"