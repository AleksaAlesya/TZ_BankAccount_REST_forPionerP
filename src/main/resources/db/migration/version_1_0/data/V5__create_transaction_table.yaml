databaseChangeLog:
  - changeSet:
      id: 5
      author: aleksa-brakor
      changes:
        - createTable:
            tableName: TRANSACTION
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: FROM_USER
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: TO_USER
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: AMOUNT
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: TIMESTAMP
                  type: TIMESTAMP
                  constraints:
                    nullable: false
            remarks: "История финансовых операций"